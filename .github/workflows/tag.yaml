name: Tag

on:
  workflow_dispatch: 
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
      message:
        description: 'Tag message'
        required: true

jobs:
  tag:
    permissions:
      # Required to push the tag. Repositories whose default GITHUB_TOKEN
      # permission is read-only otherwise fail this workflow with a 403.
      contents: write
    uses: crossplane-contrib/provider-workflows/.github/workflows/tag.yml@451c4dc6ad3691b0a702a997a0ac24e8bbc8bbaa # main
    with:
      version: ${{ github.event.inputs.version }}
      message: ${{ github.event.inputs.message }}
